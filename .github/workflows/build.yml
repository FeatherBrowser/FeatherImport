name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build src/FeatherImport/FeatherImport.csproj --configuration Release
      - run: dotnet test tests/FeatherImport.Tests/FeatherImport.Tests.csproj --configuration Release
